# ===============================================
# X64软路由-UEFI - 最终严谨缓存优化版
# ===============================================
name: X64软路由-UEFI

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions (true/false)'
        required: false
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: v24.10.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  CCACHE_DIR: /mnt/workdir/openwrt/ccache
  CCACHE_MAXSIZE: 8G

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 查看仓库
      uses: actions/checkout@v4

    - name: 设置时区
      run: sudo timedatectl set-timezone "$TZ"

    - name: 检查服务器性能
      run: |
        echo -e "\e[1;32m=== 服务器性能 ===\e[0m"
        echo -e "CPU 线程: $(nproc)"
        echo -e "内存: $(free -h | awk '/^Mem:/{print $2}')"
        df -hT /

    - name: 释放磁盘空间
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 创建工作目录
      run: |
        sudo mkdir -p /mnt/workdir/openwrt/ccache
        sudo chown -R $USER:$USER /mnt/workdir
        df -hT /mnt

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo apt-get -qq autoremove --purge
        sudo apt-get -qq clean
        sudo apt-get install -y ccache

    - name: 克隆源代码
      working-directory: /mnt/workdir
      run: |
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /mnt/workdir/openwrt $GITHUB_WORKSPACE/openwrt
        echo "CCACHE_DIR=$CCACHE_DIR" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=$CCACHE_MAXSIZE" >> $GITHUB_ENV

    - name: 配置 ccache
      run: |
        mkdir -p $CCACHE_DIR
        ccache -M $CCACHE_MAXSIZE
        ccache -z   # 清零统计（可选）

    # ==================== 缓存恢复 ====================
    - name: 恢复 dl 和 ccache 缓存
      uses: actions/cache/restore@v4
      id: cache-restore
      with:
        path: |
          openwrt/dl
          ${{ env.CCACHE_DIR }}
        key: openwrt-cache-${{ env.REPO_BRANCH }}-${{ hashFiles('openwrt/feeds.conf.default', 'openwrt/.config') || 'initial' }}
        restore-keys: |
          openwrt-cache-${{ env.REPO_BRANCH }}-

    - name: 加载自定义 feeds 配置
      run: |
        [ -f $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default || true
        chmod +x $DIY_P1_SH
        cd openwrt && $GITHUB_WORKSPACE/$DIY_P1_SH || true

    - name: 更新 feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 删除指定插件
      run: |
        cd openwrt || exit 1
        echo "=== 删除 luci-app-appfilter ==="
        rm -rf feeds/luci/applications/luci-app-appfilter 2>/dev/null || true
        sed -i '/^Source-Makefile:.*luci-app-appfilter/,/^@@/d' feeds/luci.tmp/.packageinfo 2>/dev/null || true
        sed -i '/^Package: luci-i18n-appfilter-zh-cn/,/^@@/d' feeds/luci.tmp/.packageinfo 2>/dev/null || true
        sed -i '/^$/N;/^\n$/D' feeds/luci.tmp/.packageinfo 2>/dev/null || true

        echo "=== 删除 open-app-filter ==="
        rm -rf feeds/packages/net/open-app-filter 2>/dev/null || true
        sed -i '/^Source-Makefile: feeds\/packages\/net\/open-app-filter\/Makefile/,/^@@/d' feeds/packages.tmp/.packageinfo 2>/dev/null || true
        sed -i '/^Package: appfilter/,/^@@/d' feeds/packages.tmp/.packageinfo 2>/dev/null || true
        sed -i '/^$/N;/^\n$/D' feeds/packages.tmp/.packageinfo 2>/dev/null || true
        echo "✅ 插件清理完成"

    - name: 安装 feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: 加载自定义配置
      run: |
        [ -d files ] && mv files openwrt/files || true
        [ -f $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config || true
        chmod +x $DIY_P2_SH
        cd openwrt && $GITHUB_WORKSPACE/$DIY_P2_SH || true

    - name: 下载依赖包
      run: |
        cd openwrt
        make defconfig
        make download -j8 || make download -j4 || true

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo "=== 开始编译，使用 $(nproc) 线程 + ccache ==="
        echo "ccache 统计（编译前）:"
        ccache -s
        make -j$(nproc) || make -j$(($(nproc)/2)) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "ccache 统计（编译后）:"
        ccache -s

        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME || echo "" > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    # ==================== 保存缓存 ====================
    - name: 保存 dl 和 ccache 缓存
      uses: actions/cache/save@v4
      if: always()
      with:
        path: |
          openwrt/dl
          ${{ env.CCACHE_DIR }}
        key: openwrt-cache-${{ env.REPO_BRANCH }}-${{ hashFiles('openwrt/feeds.conf.default', 'openwrt/.config') || 'initial' }}

    - name: 检查磁盘空间
      if: always()
      run: df -hT

    # ==================== 上传产物 ====================
    - name: 上传 bin 目录
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin
        retention-days: 7

    - name: 整理并上传固件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets 2>/dev/null || exit 1
        if [ -d x86/64 ]; then
          cd x86/64
        else
          cd */* 2>/dev/null || true
        fi
        rm -rf packages 2>/dev/null || true
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        ls -la ./

    - name: 上传固件目录
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        retention-days: 14

    - name: 生成 Release
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        cat > release.txt << EOF
        编译完成时间: $(date '+%Y-%m-%d %H:%M:%S')
        固件类型: ImmortalWrt x64 UEFI
        状态: 成功
        ccache 使用情况: 已启用加速
        EOF

    - name: 发布到 Releases
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success'
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 删除旧版本 Release
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: env.UPLOAD_RELEASE == 'true'
      with:
        keep_latest: 10
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
